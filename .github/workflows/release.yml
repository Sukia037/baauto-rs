name: Release
# Push a tag such as v0.1.0 or v0.1.0-preview.1. Tags containing "-" become pre-releases.
# Notes come from docs/release-notes/<tag>.md, which must exist before tagging.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --workspace
      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $r = "target/release"
          # Players only see baauto-app.exe; the engine lives in engine/.
          $app = "BAauto-$tag-windows-x64"
          New-Item -ItemType Directory "$app/engine" | Out-Null
          Copy-Item "$r/baauto-app.exe", README.md $app
          Copy-Item "$r/baauto-engine.exe" "$app/engine"
          # Latency test kit: double-click START.bat, send back result-N.zip.
          $kit = "BAauto-latency-test-$tag-windows-x64"
          New-Item -ItemType Directory "$kit/files" | Out-Null
          Copy-Item tools/latency-kit/START.bat $kit
          Copy-Item "$r/baauto-bench.exe", "$r/baauto-receiver.exe", "$r/baauto-engine.exe", tools/latency-kit/test-points.json, tools/latency-kit/test-keys.json "$kit/files"
          foreach ($name in $app, $kit) {
            Compress-Archive -Path $name -DestinationPath "$name.zip"
            $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
            # LF only, so `sha256sum -c` / `shasum -c` also work outside Windows.
            [IO.File]::WriteAllText("$PWD/$name.zip.sha256", "$hash  $name.zip`n")
          }
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = foreach ($name in "BAauto-$tag-windows-x64", "BAauto-latency-test-$tag-windows-x64") { "$name.zip"; "$name.zip.sha256" }
          $flags = @("--title", "BAauto $tag", "--notes-file", "docs/release-notes/$tag.md")
          if ($tag.Contains("-")) { $flags += "--prerelease" }
          gh release create $tag @files @flags
