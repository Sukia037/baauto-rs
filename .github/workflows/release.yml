name: Release
# Push a tag such as v0.1.0 or v0.1.0-preview.1. Tags containing "-" become pre-releases.
# Notes come from docs/release-notes/<tag>.md, which must exist before tagging.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --workspace
      - name: Package
        shell: pwsh
        run: |
          $name = "BAauto-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/baauto-app.exe, target/release/baauto-engine.exe, README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          # LF only, so `sha256sum -c` / `shasum -c` also work outside Windows.
          [IO.File]::WriteAllText("$PWD/$name.zip.sha256", "$hash  $name.zip`n")
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "BAauto-$tag-windows-x64"
          $flags = @("--title", "BAauto $tag", "--notes-file", "docs/release-notes/$tag.md")
          if ($tag.Contains("-")) { $flags += "--prerelease" }
          gh release create $tag "$name.zip" "$name.zip.sha256" @flags
