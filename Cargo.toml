[workspace]
members = ["crates/core", "crates/config", "crates/protocol", "crates/win-platform", "bins/baauto-engine", "bins/baauto-app", "tools/bench"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
arrayvec = { version = "0.7", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
serde_path_to_error = "0.1"
allocation-counter = "0.8"
rtrb = "0.4"
loom = "0.7"
windows = "0.62.2"

[profile.release]
panic = "unwind"
