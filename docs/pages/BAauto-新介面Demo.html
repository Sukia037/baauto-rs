<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAauto 介面 Demo</title>
<style>
:root{
  --page:#E8EBEF; --bg:#FFFFFF; --soft:#F5F6F8; --field:#FFFFFF;
  --line:#D8DCE1; --line2:#ECEEF1; --ink:#1C1F23; --muted:#646A73; --faint:#9AA0A8;
  --accent:#0067C0; --accent-ink:#FFFFFF; --sel:#E1EEFA;
  --good:#16833A; --warn:#946200; --bad:#C42B1C; --bad-bg:#FDECEC;
  --font:"Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC","Noto Sans TC","Segoe UI",sans-serif;
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#141517; --bg:#222326; --soft:#292B2F; --field:#1A1B1E;
    --line:#3C3F45; --line2:#303237; --ink:#E9EAEC; --muted:#A8ADB5; --faint:#747982;
    --accent:#5AB4F5; --accent-ink:#06223A; --sel:#1E3850;
    --good:#5CC27A; --warn:#E3B341; --bad:#FF8A80; --bad-bg:#3B2324;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#141517; --bg:#222326; --soft:#292B2F; --field:#1A1B1E;
  --line:#3C3F45; --line2:#303237; --ink:#E9EAEC; --muted:#A8ADB5; --faint:#747982;
  --accent:#5AB4F5; --accent-ink:#06223A; --sel:#1E3850;
  --good:#5CC27A; --warn:#E3B341; --bad:#FF8A80; --bad-bg:#3B2324;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font:13px/1.5 var(--font)}
.page{max-width:1040px;margin:0 auto;padding:16px 16px 28px}
.page h1{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 10px}
.frame{overflow-x:auto;padding:2px 0 14px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.4}
input,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;height:30px;padding:0 8px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
input.n{width:66px;text-align:right;font-variant-numeric:tabular-nums}
input.n.err{border-color:var(--bad)}

.win{width:980px;height:650px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.sp{flex:1}
.mut{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.path{color:var(--faint);font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.small{font-size:12px}
.state{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.state i{width:8px;height:8px;border-radius:50%;background:currentColor}
.state.ok{color:var(--good)} .state.warn{color:var(--warn)} .state.bad{color:var(--bad)} .state.off{color:var(--faint)}
.btn{height:30px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--field);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--soft)}
.btn.sm{height:28px;padding:0 10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.07)}
.btn.rec{border-color:var(--accent);color:var(--accent)}
.lnk{border:0;background:none;padding:0;color:var(--accent);white-space:nowrap}
.lnk:hover:not(:disabled){text-decoration:underline}
.lnk.danger{color:var(--bad)}
.t-bad{color:var(--bad)} .t-warn{color:var(--warn)} .t-off{color:var(--faint)} .t-ok{color:var(--good)}

/* 頂部：兩種 JSON */
.ctop{display:flex;align-items:center;gap:10px;padding:10px 16px 4px}
.brand{font-weight:700;font-size:14px;letter-spacing:.02em}
.frow{display:grid;grid-template-columns:64px auto auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:4px 16px;min-width:0}
.frow .lab{font-weight:600;color:var(--muted)}
.frow .links{display:flex;gap:12px;font-size:12px}
.pseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;max-width:440px;overflow-x:auto;scrollbar-width:thin}
.pseg button{border:0;background:var(--field);padding:0 12px;height:30px;color:var(--muted);font:12.5px var(--mono);white-space:nowrap}
.pseg button+button{border-left:1px solid var(--line)}
.pseg button[aria-pressed="true"]{background:var(--sel);color:var(--ink);font-weight:700}
.pseg button.add{font-family:var(--font);padding:0 11px}
.pinfo{display:flex;align-items:center;gap:10px;min-width:0}
.tagm{font-size:12px;color:var(--muted);white-space:nowrap}
.ctabs{display:flex;align-items:center;gap:4px;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.ctabs button{border:0;background:none;padding:5px 12px;border-radius:999px;color:var(--muted)}
.ctabs button:hover{background:var(--soft);color:var(--ink)}
.ctabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.ctabs .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-left:5px;vertical-align:middle}
.ctabs .src{margin-left:auto;font-size:12px;color:var(--faint)}

/* 內容 */
main{flex:1;min-height:0;padding:12px 16px 14px}
main>section{height:100%;min-height:0;display:grid;gap:14px}
.g-points{grid-template-columns:210px minmax(0,1fr) 290px}
.g-presets{grid-template-columns:minmax(0,1fr) 290px}
.g-timing{grid-template-columns:minmax(0,1fr) 290px}
.g-log{grid-template-columns:minmax(0,1fr) 320px}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{display:flex;align-items:center;gap:8px;height:34px;flex:none}
.ph b{font-size:13.5px}
.cnt{color:var(--faint);font-size:12px}
.list{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.row{display:grid;align-items:center;gap:8px;min-height:34px;padding:2px 10px;border-bottom:1px solid var(--line2);cursor:default}
.row:last-child{border-bottom:0}
.row.head{position:sticky;top:0;z-index:1;min-height:28px;background:var(--soft);color:var(--faint);font-size:12px}
.row.grp{min-height:26px;background:var(--soft);color:var(--muted);font-size:12px;font-weight:600;display:block;line-height:26px}
.row[data-sel]:hover{background:var(--soft)}
.row.sel,.row.sel:hover{background:var(--sel)}
.row.dim>span:first-child{color:var(--faint)}
.empty{padding:22px 12px;color:var(--faint);text-align:center;font-size:12.5px}
.c-cand .row{grid-template-columns:minmax(0,1fr) auto}
.c-pts .row{grid-template-columns:minmax(0,1fr) 74px 62px 84px 40px}
.c-pre .row:not(.grp){grid-template-columns:minmax(0,1fr) 110px 150px}
.c-tm .row{grid-template-columns:minmax(0,1fr) 100px minmax(0,1.1fr)}
.c-log .row{grid-template-columns:52px minmax(0,1fr);min-height:32px}
.c-rep .row{grid-template-columns:minmax(0,1fr) auto}
.fn{font-size:12px;padding:1px 6px;border-radius:4px;background:var(--soft);color:var(--muted);white-space:nowrap;justify-self:start}
.fn.card{background:var(--sel);color:var(--ink)}
.dotm{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;background:var(--faint);vertical-align:middle}
.dotm.bad{background:var(--bad)} .dotm.warn{background:var(--warn)}

.chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 8px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--field);font:12px var(--mono);white-space:nowrap}
.chip:hover:not(:disabled){border-color:var(--accent)}
.chip.empty{border-style:dashed;border-bottom-width:1px;color:var(--faint);font-family:var(--font)}
.chip.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.chip.off{color:var(--faint)}
.chip.cap{border-color:var(--accent);background:var(--sel);color:var(--ink);font-family:var(--font);border-bottom-width:1px}
.chip.big{height:32px;min-width:64px;font-size:13px}

/* 右側詳細 */
.insp{border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0}
.insp h3{margin:0;font-size:14px}
.insp h4{margin:6px 0 0;font-size:12.5px;color:var(--muted);font-weight:600;padding-top:10px;border-top:1px solid var(--line2)}
.insp h4 .path{display:block;font-weight:400;font-size:11.5px}
.insp .f{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:center}
.insp .f>.k{color:var(--muted)}
.insp .f .v{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.insp .acts{display:flex;gap:14px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line2)}
.insp .none{margin:auto;color:var(--faint);text-align:center;font-size:12.5px}
.insp hr{border:0;border-top:1px solid var(--line2);margin:2px 0;width:100%}
.insp p{margin:0}
.chk{display:inline-flex;align-items:center;gap:6px}
.chk input{height:auto}
.sw{position:relative;width:30px;height:18px;border-radius:9px;border:0;background:var(--line);padding:0;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .12s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(12px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;justify-self:start}
.seg button{border:0;background:var(--field);padding:0 12px;height:28px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--ink);font-weight:600}
.slotk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}

.savebar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-top:1px solid var(--line);background:var(--soft);flex:none}
.savebar .msg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.savebar .msg b{font-family:var(--mono);font-size:12.5px}
.status{display:flex;align-items:center;gap:16px;height:30px;padding:0 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;flex:none}
.status .ok{color:var(--good)} .status .warn{color:var(--warn)} .status .bad{color:var(--bad)} .status .hint{color:var(--ink)}

.demo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;width:980px;max-width:100%;margin:0 auto;color:var(--muted);font-size:12.5px}
.demo label{display:flex;align-items:center;gap:6px}
.demo select{height:28px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{width:min(540px,100%);background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.dlg h2{font-size:14px;margin:0;padding:14px 16px 6px}
.dlg .body{padding:4px 16px;display:flex;flex-direction:column;gap:8px}
.dlg .body p{margin:0;color:var(--muted)}
.dlg .btns{display:flex;justify-content:flex-end;gap:8px;padding:14px 16px}
.dlg .of{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--field);text-align:left;padding:8px 12px}
.dlg .of:hover{border-color:var(--accent)}
.dlg .of .p{font:12.5px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg .of .d{grid-column:1 / -1;font-size:12px;color:var(--muted)}
.dlg .row2{display:grid;grid-template-columns:80px minmax(0,1fr);gap:8px;align-items:center}
.frow .seg{flex:none}
.win.drop{outline:3px dashed var(--accent);outline-offset:-3px}
.btn.danger{color:var(--bad)}
.pseg .ftab{display:inline-flex;align-items:center;background:var(--field)}
.pseg .ftab+.ftab{border-left:1px solid var(--line)}
.pseg .ftab button{border:0;background:transparent}
.pseg .ftab .x{padding:0 9px 0 0;color:var(--faint);font:13px var(--font);border-left:0}
.pseg .ftab .x:hover:not(:disabled){color:var(--bad)}
.pseg .ftab.on{background:var(--sel)}
.pseg .ftab.on button{color:var(--ink)}
.fbtns{display:flex;gap:6px}
.frow .seg button{height:26px;padding:0 10px;font-size:12.5px;white-space:nowrap}
</style>
</head>
<body>
<div class="page">
  <h1>BAauto 介面 Demo・三欄版・資料都是示範值，不會送出任何按鍵</h1>
  <div class="frame">
  <div class="win" id="win">
    <div class="ctop">
      <span class="brand">BAauto</span>
      <span class="sp"></span>
      <span class="state" id="state"></span>
      <button type="button" class="btn" id="runBtn" data-act="run" title="緊急停止：Ctrl+F9"></button>
    </div>
    <div class="frow">
      <span class="lab">點位</span>
      <span class="pseg" id="pfFiles"></span>
      <span class="fbtns"><button type="button" class="btn sm" data-act="newFile" data-kind="pf">新增</button><button type="button" class="btn sm" data-act="open" data-kind="pf">開啟…</button></span>
      <span class="pinfo"><span class="seg" id="modeSeg" title="這個點位檔是幾人編成"><button type="button" data-mode="six">六人</button><button type="button" data-mode="ten">十人</button></span><span class="path" id="pfPath"></span></span>
      <span class="links"><button type="button" class="lnk" data-act="saveAs" data-kind="pf">另存新檔…</button><button type="button" class="lnk" data-act="reload" data-kind="pf">重新載入</button></span>
    </div>
    <div class="frow">
      <span class="lab">預設按鍵</span>
      <span class="pseg" id="keysFiles"></span>
      <span class="fbtns"><button type="button" class="btn sm" data-act="newFile" data-kind="keys">新增</button><button type="button" class="btn sm" data-act="open" data-kind="keys">開啟…</button></span>
      <span class="pinfo"><span class="path" id="keysPath"></span></span>
      <span class="links"><button type="button" class="lnk" data-act="saveAs" data-kind="keys">另存新檔…</button><button type="button" class="lnk" data-act="reload" data-kind="keys">重新載入</button></span>
    </div>
    <nav class="ctabs" role="tablist">
      <button type="button" role="tab" data-tab="points">點位</button>
      <button type="button" role="tab" data-tab="presets">預設按鍵<span class="dot" id="preDot" hidden></span></button>
      <button type="button" role="tab" data-tab="timing">時間</button>
      <button type="button" role="tab" data-tab="log">紀錄</button>
      <span class="src" id="tabSrc"></span>
    </nav>

    <main>
      <section data-view="points" class="g-points">
        <div class="pane">
          <div class="ph"><b>候選點位</b><span class="cnt" id="ccnt"></span><span class="sp"></span><button type="button" class="btn sm" id="recBtn" data-act="record"></button></div>
          <div class="list c-cand" id="cands"></div>
        </div>
        <div class="pane">
          <div class="ph"><b>點位按鍵清單</b><span class="cnt" id="pcnt"></span><span class="sp"></span><button type="button" class="lnk" data-act="addCard">＋ 牌鍵</button></div>
          <div class="list c-pts" id="pts"></div>
        </div>
        <div class="insp" id="ptInsp"></div>
      </section>

      <section data-view="presets" class="g-presets" hidden>
        <div class="pane">
          <div class="ph"><b>預設按鍵</b><span class="cnt" id="preCnt"></span><span class="sp"></span><button type="button" class="lnk" data-act="presetResetAll">恢復全部預設</button></div>
          <div class="list c-pre" id="pres"></div>
        </div>
        <div class="insp" id="preInsp"></div>
      </section>

      <section data-view="timing" class="g-timing" hidden>
        <div class="pane">
          <div class="ph"><b>時間</b><span class="cnt">ms</span></div>
          <div class="list c-tm" id="tms"></div>
        </div>
        <div class="insp" id="tmInsp"></div>
      </section>

      <section data-view="log" class="g-log" hidden>
        <div class="pane">
          <div class="ph"><b>事件</b><span class="cnt" id="logCnt"></span></div>
          <div class="list c-log" id="logs"></div>
        </div>
        <div class="pane">
          <div class="ph"><b>報告與故障紀錄</b><span class="sp"></span><button type="button" class="lnk" data-act="openLogs">開啟資料夾</button></div>
          <div class="list c-rep" id="reps"></div>
        </div>
      </section>
    </main>

    <div class="savebar" id="savebar" hidden><span class="msg" id="saveMsg"></span><button type="button" class="btn" data-act="revert">還原</button><button type="button" class="btn primary" data-act="save" id="saveBtn">儲存</button></div>
    <div class="status" id="status"></div>
  </div>
  </div>
  <div class="demo">
    <span>Demo：</span>
    <label><input type="checkbox" id="simFocus" checked> 遊戲在前景</label>
    <button type="button" class="btn sm" id="simFault">模擬引擎故障</button>
    <label>主題 <select id="themeSel"><option value="">跟系統</option><option value="light">淺色</option><option value="dark">深色</option></select></label>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h2 id="dlgT"></h2><div class="body" id="dlgB"></div><div class="btns" id="dlgK"></div></div></div>

<script>
(function(){
'use strict';
var RES = {w:2560, h:1440};
var DIRS = {pf:'C:\\BAauto\\points\\', keys:'C:\\BAauto\\keys\\'};
var KIND = {pf:'點位', keys:'預設按鍵'};
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function el(tag, a, kids){
  var e = document.createElement(tag);
  if(a) Object.keys(a).forEach(function(k){
    var v = a[k]; if(v == null || v === false) return;
    if(k === 'class') e.className = v; else if(k === 'text') e.textContent = v;
    else if(k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  });
  (kids || []).forEach(function(c){ if(c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function setVal(e, v){ if(!e) return; v = v == null || (typeof v === 'number' && isNaN(v)) ? '' : String(v); if(document.activeElement !== e && e.value !== v) e.value = v; }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function now(){ var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

// ---------- 預設按鍵（和 AHK 版同樣 23 個） ----------
var DEFS = [], BY = {};
var GROUPS = [{name:'技能', roles:[]}, {name:'技能連點', roles:[]}, {name:'卡幀開牌', roles:[]}, {name:'其他', roles:['pause', 'frame_fast', 'frame_slow', 'auto', 'speed', 'click_spam', 'record', 'global_stop']}];
function def(role, name, hk, act, slot){ var d = {role:role, name:name, hk:hk, act:act, slot:slot}; DEFS.push(d); BY[role] = d; }
['w','e','r','t','y'].forEach(function(k, i){ var n = i + 1; def('skill_' + n, '技能 ' + n, k, '送出 ' + n + ' 一次。', n); GROUPS[0].roles.push('skill_' + n); });
['2','3','4','5','6'].forEach(function(k, i){ var n = i + 1; def('spam_' + n, '連點 ' + n, k, '按住時一直重複「送出 ' + n + '，再點一下左鍵」。', n); GROUPS[1].roles.push('spam_' + n); });
['a','s','d','f','g'].forEach(function(k, i){ var n = i + 1; def('card_' + n, '開牌 ' + n, k, '按下先送 Esc，按住時重複「送出 ' + n + '＋左鍵」，放開再送 Esc。', n); GROUPS[2].roles.push('card_' + n); });
def('pause', '普通暫停', 'Space', '送出 Esc。');
def('frame_fast', '卡幀暫停（快）', 'Down', 'Esc，等最短間隔，再 Esc。');
def('frame_slow', '卡幀暫停（慢）', 'Up', 'Esc，等最長間隔，再 Esc。');

function analyze(){
  var k = KF(), f = PF(), owners = {}, r = {pre:{}, it:{}, conflicts:0, tm:{}, keysBlock:[]};
  DEFS.forEach(function(d){ var x = k.presets[d.role], h = norm(x.hk); if(h && x.en) (owners[h] = owners[h] || []).push(d.name); });
  DEFS.forEach(function(d){
    var x = k.presets[d.role], h = norm(x.hk);
    if(!h) r.pre[d.role] = {s:'off', m:'沒有熱鍵，停用'};
    else if(!x.en) r.pre[d.role] = {s:'off', m:'停用'};
    else if(owners[h].length > 1){ r.pre[d.role] = {s:'bad', m:'和「' + owners[h].filter(function(n){ return n !== d.name; }).join('、') + '」重複'}; r.conflicts++; }
    else r.pre[d.role] = {s:'ok', m:f.mode === 'six' && d.slot >= 4 ? '啟用（六人沒有第 ' + d.slot + ' 格）' : '啟用'};
  });
  var others = {};
  f.items.forEach(function(q){ var h = norm(q.hk); if(h) (others[h] = others[h] || []).push(q.name); });
  f.items.forEach(function(q){
    var h = norm(q.hk), s;
    if(!h) s = {s:'off', m:'沒有熱鍵，不會觸發'};
    else if(owners[h] && owners[h].length === 1) s = {s:'bad', m:'和預設按鍵「' + owners[h][0] + '」重複，停用'};
    else if(others[h].length > 1) s = {s:'bad', m:'和「' + others[h].filter(function(n){ return n !== q.name; })[0] + '」重複，停用'};
    else s = {s:'ok', m:'啟用'};
    r.it[q.id] = s;
  });
  var t = k.timing;
  TM.forEach(function(x){ var v = t[x.f]; if(typeof v !== 'number' || isNaN(v) || v < 0) r.tm[x.f] = '要填 0 以上的數字'; });
  var need = t.key_hold_ms + t.key_to_click_ms + t.mouse_hold_ms;
  if(!r.tm.repeat_period_ms && t.repeat_period_ms < need) r.tm.repeat_period_ms = '至少要 ' + need;
  if(!r.tm.esc_max_ms && t.esc_min_ms > t.esc_max_ms) r.tm.esc_max_ms = '不能比最短還短';
  if(t.key_hold_ms === 0 && !t.verified) r.tm.key_hold_ms = '0 只有已驗證時能用';
  if(r.conflicts) r.keysBlock.push('預設按鍵有重複');
  if(Object.keys(r.tm).length) r.keysBlock.push('時間設定有錯');
  return r;
}
function slotAt(x, y){
  var L = RECT(), n = N();
  if(!(x >= L.x1 && x <= L.x2 && y >= L.y1 && y <= L.y2)) return 0;
  var i = Math.min(n - 1, Math.floor((x - L.x1) / ((L.x2 - L.x1) / n)));
  return S.hand.order === 'ltr' ? i + 1 : n - i;
}

function detect(o){

  if(o.schema === 'baauto-rs-points-v1' || (Array.isArray(o.items) && o.mode)) return {k:'pf', legacy:false, label:'點位 JSON'};
  if(o.schema === 'baauto-rs-keys-v1' || (o.presets && o.timing)) return {k:'keys', legacy:false, label:'預設按鍵 JSON'};
  if(o.schema === 'baauto-points-v1' || Array.isArray(o.bindings)) return {k:'pf', legacy:true, label:'舊版 AHK 點位 JSON'};
  if(Array.isArray(o.keys)) return {k:'pf', legacy:true, label:'更舊的 keys 格式點位 JSON'};
  if(o.schema === 'baauto-functions-v1' || (o.hotkeys && typeof o.hotkeys === 'object')) return {k:'keys', legacy:true, label:'舊版 AHK 功能 JSON'};

}
function num(v){ return v === true ? 1 : v === false ? 0 : +v; }
function ahkKey(s){

}

// 把任何一種內容轉成 Demo 的資料；回傳 {k, file, notes}
function convert(o, path){
  var d = detect(o), notes = [];
  if(d.k === 'pf'){
    var items = [], mode = o.mode === 'ten' ? 'ten' : 'six';
    if(!d.legacy) (o.items || []).forEach(function(it, i){
      var x = num(it.x), y = num(it.y);
      items.push(it['function'] === 'card' ? {id:i + 1, name:it.name || '出牌', hk:it.hotkey || '', fn:'card'}
        : {id:i + 1, name:it.name || '點位 ' + (i + 1), hk:it.hotkey || '', fn:'point', x:Math.round(x <= 1 ? x * RES.w : x), y:Math.round(y <= 1 ? y * RES.h : y)});
    });
    else if(Array.isArray(o.bindings)){
      var bools = 0, drags = 0;
      o.bindings.forEach(function(b, i){
        if(!b || typeof b !== 'object') return;
        if(typeof b.rel_x === 'boolean' || typeof b.rel_y === 'boolean') bools++;
        var hk = ahkKey(b.hotkey != null ? b.hotkey : b.key);
        if(b['function'] === 'alternating'){ drags++; items.push({id:i + 1, name:b.name || '牌鍵 ' + (i + 1), hk:hk, fn:'card'}); }
        else items.push({id:i + 1, name:b.name || '點位 ' + (i + 1), hk:hk, fn:'point', x:Math.round(num(b.rel_x) * RES.w), y:Math.round(num(b.rel_y) * RES.h)});
      });
      if(drags) notes.push(drags + ' 個拖曳點位改成牌鍵（拖曳終點不再使用）');
      if(bools) notes.push(bools + ' 個座標是 true／false，已改成 1／0');
    } else {
      var bw = num(o.width || o.screenW || 0), bh = num(o.height || o.screenH || 0);
      o.keys.forEach(function(it, i){
        var rx = it.rel_x, ry = it.rel_y;
        if(rx == null || ry == null){ if(!(bw > 0 && bh > 0)){ bw = RES.w; bh = RES.h; notes.push('沒有基準尺寸：正式版會問你當時的解析度，Demo 先當成 2560×1440'); } rx = num(it.x) / bw; ry = num(it.y) / bh; }
        items.push({id:i + 1, name:'舊版點位 ' + (i + 1), hk:ahkKey(it.key), fn:'point', x:Math.round(num(rx) * RES.w), y:Math.round(num(ry) * RES.h)});
      });
    }
    return {k:'pf', file:makePf(path, mode, items), notes:notes, legacy:d.legacy};
  }
  var f = makeKeys(path), src = d.legacy ? o.hotkeys : o.presets, n = 0;
  DEFS.forEach(function(df){
    var v = src && src[df.role]; if(v == null) return; n++;
    if(d.legacy){ f.presets[df.role].hk = ahkKey(v); }
    else { var h = String(v.hotkey || ''); f.presets[df.role] = {hk:h.replace(/^=/, ''), exact:/^=/.test(h), en:v.enabled !== false}; }
  });
  if(n < 23) notes.push((23 - n) + ' 個預設按鍵檔案裡沒寫，用範本值');
  if(!d.legacy && o.timing){
    var t = o.timing, T = f.timing;
    ['key_hold_ms', 'mouse_hold_ms', 'key_to_click_ms', 'repeat_period_ms', 'card_pre_esc_ms', 'hold_maintain_period_ms'].forEach(function(x){ if(t[x] != null) T[x] = +t[x]; });
    if(Array.isArray(t.escape_gap_ms)){ T.esc_min_ms = +t.escape_gap_ms[0]; T.esc_max_ms = +t.escape_gap_ms[1]; }
    T.verified = !!t.verified;
  }
  if(d.legacy) notes.push('舊版 timing_ms 只當參考，時間用範本值、標成未驗證');
  return {k:'keys', file:f, notes:notes, legacy:d.legacy};
}

function openDlg(title, body, buttons){
  $('#dlgT').textContent = title;
  var b = $('#dlgB'); b.textContent = ''; body.forEach(function(n){ b.appendChild(n); });

function closeDlg(){ $('#modal').hidden = true; }

// ---------- 熱鍵擷取 ----------
function mods(e, b){ return (e.ctrlKey ? 'Ctrl+' : '') + (e.altKey ? 'Alt+' : '') + (e.shiftKey ? 'Shift+' : '') + b; }
function keyName(e){
  var k = e.key;
  if(['Control', 'Shift', 'Alt', 'Meta', 'OS'].indexOf(k) >= 0) return null;
  var map = {' ':'Space', 'ArrowDown':'Down', 'ArrowUp':'Up', 'ArrowLeft':'Left', 'ArrowRight':'Right', 'Enter':'Enter', 'Tab':'Tab', 'Delete':'Delete', 'Insert':'Insert', 'Home':'Home', 'End':'End', 'PageUp':'PgUp', 'PageDown':'PgDn'};
  var b;
  if(map[k]) b = map[k];
  else if(/^F\d{1,2}$/.test(k)) b = k;
  else if(e.code && /^Key[A-Z]$/.test(e.code)) b = e.code.slice(3).toLowerCase();
  else if(e.code && /^Digit\d$/.test(e.code)) b = e.code.slice(5);
  else b = k.length === 1 ? k.toLowerCase() : k;
  return mods(e, b);
}
function isSlot(){ return S.capture && S.capture.key.indexOf('sl:') === 0; }
function startCap(key){

  S.hint = key.indexOf('sl:') === 0 ? '按下這一格要送出的鍵盤按鍵。Esc 取消。' : '按下要用的鍵，也可以按滑鼠右鍵、中鍵、側鍵。Esc 取消，Backspace 清除。';
  render();
}
function endCap(v){
  var c = S.capture; S.capture = null; S.hint = '';
  if(c && v != null){
    var parts = c.key.split(':'), kind = parts[0], id = parts[1];
    if(kind === 'it'){ var q = item(+id); if(q){ q.hk = v; dirty('pf'); } }
    else if(kind === 'ps'){ KF().presets[id].hk = v; S.selPre = id; dirty('keys'); }
    else if(kind === 'sl'){ if(v){ S.hand.slotKeys[+id] = v; saveHand(); } }
  }
  render();
}
document.addEventListener('keydown', function(e){
  if(S.capture){
    e.preventDefault(); e.stopPropagation();
    if(e.key === 'Escape') return endCap(null);
    if(e.key === 'Backspace' && !isSlot()) return endCap('');
    var n = keyName(e); if(!n) return;
    if(isSlot()) n = n.replace(/^(Ctrl\+|Alt\+|Shift\+)+/, '');
    return endCap(n);
  }
  if(e.key === 'Escape'){
    if(!$('#modal').hidden){ closeDlg(); return; }
    if(S.rec){ endRec(); flash('已取消錄製。'); render(); }
  }
}, true);
document.addEventListener('mousedown', function(e){
  if(!S.capture) return;
  if(e.button === 0){ if(!e.target.closest('[data-cap]')) endCap(null); return; }
  e.preventDefault();
  if(isSlot()){ endCap(null); flash('每一格要送出的是鍵盤按鍵，不能用滑鼠鍵。'); render(); return; }
  var m = {1:'MButton', 2:'RButton', 3:'XButton1', 4:'XButton2'}[e.button]; if(m) endCap(mods(e, m));
}, true);
document.addEventListener('mouseup', function(e){ if(e.button === 3 || e.button === 4) e.preventDefault(); }, true);
document.addEventListener('contextmenu', function(e){ if(S.capture || e.target.closest('[data-cap]')) e.preventDefault(); }, true);

// ---------- 事件 ----------
document.addEventListener('click', function(e){

  var tab = t.closest('[data-tab]'); if(tab){ S.tab = tab.dataset.tab; S.capture = null; S.hint = ''; render(); return; }

  if((r = t.closest('[data-tm]'))){ S.selTm = r.dataset.tm; render(); $('#tm_' + S.selTm).focus(); return; }
});
document.addEventListener('focusin', function(e){ var f = e.target.dataset && e.target.dataset.tmin; if(f && S.selTm !== f){ S.selTm = f; renderTiming(analyze()); } });

$('#simFault').addEventListener('click', function(){ S.busy = ''; S.run = 'fault'; log('bad', '引擎沒有回應：已終止引擎並放開所有按鍵，不會自動恢復。'); render(); });

buildTiming();
