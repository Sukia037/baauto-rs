[package]
name = "baauto-app"
version.workspace = true
edition.workspace = true

[dependencies]
baauto-core = { path = "../../crates/core" }
baauto-config = { path = "../../crates/config" }
baauto-protocol = { path = "../../crates/protocol" }
baauto-win-platform = { path = "../../crates/win-platform" }

eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
rfd = "0.17.2"
image = {version="0.25.10",default-features=false,features=["png"]}
serde.workspace = true
serde_json.workspace = true

[features]
bench-experiments = ["baauto-win-platform/bench-experiments"]
fault-injection = ["baauto-win-platform/fault-injection"]
test-hooks = ["baauto-win-platform/test-hooks"]
