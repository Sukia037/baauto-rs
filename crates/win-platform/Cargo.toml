[package]
name = "baauto-win-platform"
version.workspace = true
edition.workspace = true

[dependencies]
baauto-core = { path = "../core" }
baauto-config = { path = "../config" }
baauto-protocol = { path = "../protocol" }
arrayvec.workspace = true
rtrb.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
test-hooks = []
fault-injection = []

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
 "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
 "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_System_Threading",
 "Win32_System_Performance", "Win32_System_Memory", "Win32_System_LibraryLoader",
 "Win32_System_Console", "Win32_System_SystemInformation", "Win32_Security",
 "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO",
 "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi",
 "Win32_Security_Cryptography", "Win32_UI_Input", "Win32_System_Diagnostics_Debug"
] }

[dev-dependencies]
allocation-counter.workspace = true
